name: db-errfill
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency:
  group: errfill
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node errfill.js
        env:
          SHEETS: ${{ secrets.SHEETS }}
          META: ${{ secrets.META }}
          GSA: ${{ secrets.GSA }}
      - name: keepalive
        if: github.event_name == 'schedule'
        run: |
          d=$(date -u +%Y-%m)
          if [ "$(cat .keepalive 2>/dev/null)" != "$d" ]; then
            echo "$d" > .keepalive
            git config user.name bot
            git config user.email bot@users.noreply.github.com
            git add .keepalive
            git commit -m "keepalive $d"
            git push
          fi
