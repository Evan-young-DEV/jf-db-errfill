name: db-errfill
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency:
  group: errfill
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: keepalive
        run: |
          d=$(date -u +%Y-%m)
          if [ "$(cat .keepalive 2>/dev/null)" != "$d" ]; then
            echo "$d" > .keepalive
            git config user.name bot
            git config user.email bot@users.noreply.github.com
            git add .keepalive
            git commit -m "keepalive $d"
            git push || true
          fi
      - run: node errfill.js
        env:
          SHEETS: ${{ secrets.SHEETS }}
          META: ${{ secrets.META }}
          GSA: ${{ secrets.GSA }}
          LOOP_MIN: '55'
          EVERY_SEC: '120'
      # 끝나면 바로 다음 실행 시작 (GitHub 예약 지연으로 끊기지 않게). 예약은 체인이 끊겼을 때 복구용
      - name: next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run errfill.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
