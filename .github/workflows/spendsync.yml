name: spend-sync
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency:
  group: spendsync
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node spendsync.js
        env:
          SHEETS: ${{ secrets.SHEETS }}
          META: ${{ secrets.META }}
          GSA: ${{ secrets.GSA }}
          LOOP_MIN: '55'
          EVERY_SEC: '300'
