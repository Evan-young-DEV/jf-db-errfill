name: spend-sync
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      loop_min:
        description: 반복 시간(분), 테스트용
        required: false
        default: '55'
concurrency:
  group: spendsync
  cancel-in-progress: false
permissions:
  contents: read
  actions: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node spendsync.js
        env:
          SHEETS: ${{ secrets.SHEETS }}
          META: ${{ secrets.META }}
          GSA: ${{ secrets.GSA }}
          LOOP_MIN: ${{ inputs.loop_min || '55' }}
          EVERY_SEC: '300'
      # 끝나면 바로 다음 실행 시작 (GitHub 예약 지연으로 끊기지 않게). 예약은 체인이 끊겼을 때 복구용
      - name: next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run spendsync.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
